[package]
authors = ["pleme-io"]
description = "lava-anomaly — typed AnomalyController surface for the lava-suite. LavaAnomaly { kind, severity, source, message } + RemediationPolicy { NoOp | Alert | AutoCorrect | RequireApproval | Escalate } + AnomalyRouter trait + EscalationLadder. Operationalizes theory/CONTINUOUS-SOLUTION-MACHINE.md anomaly routing for IaC drift, synth failures, apply failures, and policy violations."
edition = "2024"
license = "MIT"
name = "lava-anomaly"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-anomaly"
version = "0.1.3"

[lib]
name = "lava_anomaly"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-drift = { git = "https://github.com/pleme-io/lava-drift", branch = "main" }
lava-outcome-chain = { git = "https://github.com/pleme-io/lava-outcome-chain", branch = "main" }
